<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Milkly - Turn the internet into your newsletter</title>
    <meta name="description" content="Milkly helps creators aggregate content from across the web and publish beautiful newsletters." />
    <meta name="author" content="Milkly" />
    <meta name="theme-color" content="#fcfcfc" />

    <meta property="og:title" content="Milkly - Turn the internet into your newsletter" />

    <meta property="og:type" content="website" />

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <script>
      (function() {
        const theme = localStorage.getItem('theme');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
